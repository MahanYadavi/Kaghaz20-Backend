name: Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Run database migration
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /root/kaghaz20/PaperBackEnd

            echo "Pulling latest code..."
            git pull origin main

            echo "Restoring dependencies..."
            dotnet restore

            echo "Loading database connection string..."
            export ConnectionStrings__DefaultConnection="$(grep '^ConnectionStrings__DefaultConnection=' /etc/papersite/backend.env | cut -d= -f2-)"

            if [ -z "$ConnectionStrings__DefaultConnection" ]; then
              echo "Database connection string is missing"
              exit 1
            fi

            export PATH="$PATH:/root/.dotnet/tools"

            echo "Checking migrations..."
            dotnet ef migrations list \
              --project PaperSite.Infrastructure \
              --startup-project PaperSite.API

            echo "Applying migrations..."
            dotnet ef database update \
              --project PaperSite.Infrastructure \
              --startup-project PaperSite.API

            echo "Migration completed successfully!"
