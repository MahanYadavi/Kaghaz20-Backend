name: Deploy PaperSite Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            cd /root/kaghaz20/PaperBackEnd

            echo "Pulling latest code..."
            git pull origin main

            echo "Restoring dependencies..."
            dotnet restore

            echo "Publishing application..."
            rm -rf /tmp/papersite-api-new

            dotnet publish \
              PaperSite.API/PaperSite.API.csproj \
              -c Release \
              -o /tmp/papersite-api-new

            echo "Deploying application..."
            rm -rf /var/www/papersite-api/*
            cp -r /tmp/papersite-api-new/* /var/www/papersite-api/

            echo "Restarting service..."
            systemctl restart papersite-api

            echo "Checking service..."
            systemctl is-active --quiet papersite-api

            echo "Deployment successful!"
